# Qt MCP releases are versioned after the newest supported MCP protocol
# revision (CalVer, e.g. 2026.7.28 = revision 2026-07-28); bugfix releases
# within one revision append a fourth component. This is the version of the
# release tags and of the QtMcp CMake package.
set(QTMCP_VERSION "2026.7.28")

# The Qt module machinery derives the Qt6:: target namespace and the
# find_package(Qt6 COMPONENTS ...) compatibility check from the major of
# this version, so it has to stay in the 6.x range; it tracks the Qt
# release the modules are developed against and feeds the SONAME.
set(QT_REPO_MODULE_VERSION "6.11.1")
set(QT_REPO_MODULE_PRERELEASE_VERSION_SEGMENT "alpha1")
set(QT_EXTRA_INTERNAL_TARGET_DEFINES "QT_NO_AS_CONST=1")
list(APPEND QT_EXTRA_INTERNAL_TARGET_DEFINES "QT_NO_FOREACH=1")
